name: Aktualizace tržních dat

on:
  schedule:
    # Každý pracovní den ve 22:15 UTC (po uzavření amerických a evropských trhů)
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aktualizace data/market-data.json
        run: python3 scripts/update_data.py

      - name: Commit a push aktualizovaných dat
        run: |
          if git diff --quiet data/market-data.json; then
            echo "Žádné změny v data/market-data.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-data.json
          git commit -m "chore(data): denní aktualizace tržních dat"
          git push
